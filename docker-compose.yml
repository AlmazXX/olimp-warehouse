services:
  postgres_db:
    image: postgres:16.9
    environment:
      POSTGRES_DB: olimp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d olimp']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres_db
      POSTGRES_DB: olimp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      CORS_ORIGIN: http://localhost:3000
      PORT: 8000
    ports:
      - '8000:8000'
    depends_on:
      postgres_db:
          condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_BANK_ID: 1
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data: